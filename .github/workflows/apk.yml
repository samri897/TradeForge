name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          EXPO_PUBLIC_TWELVE_DATA_API_KEY: ${{ secrets.EXPO_PUBLIC_TWELVE_DATA_API_KEY }}

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_TWELVE_DATA_API_KEY: ${{ secrets.EXPO_PUBLIC_TWELVE_DATA_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeForge-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
